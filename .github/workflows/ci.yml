name: CI

# Test-gate: a ogni push/PR gira l'intera suite di test + typecheck + build.
# Il deploy su Railway va fatto SOLO a CI verde (vedi skill whatsapp-studio).
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # node:sqlite (usato da test_dedup) su alcune minor richiede il flag sperimentale.
      NODE_OPTIONS: '--experimental-sqlite --no-warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --ignore-scripts: niente compilazione nativa di better-sqlite3 (non serve per
      # test puri + typecheck + build; esbuild lo esternalizza).
      - name: Install deps
        run: npm ci --ignore-scripts
      - name: Test suite (tutti i test_*.ts)
        run: npm run test:all
      - name: Typecheck
        run: npm run typecheck
      - name: Build (client + server)
        run: npm run build:local
